# Dependency version updates. Security updates are additionally driven by
# GitHub Dependabot alerts (enable "Dependabot security updates" in repo
# Settings → Code security) — that toggle is what auto-PRs advisory fixes like
# the sanitize-html CVSS 9.3 that this audit caught.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # MONTHLY, not weekly. Weekly produced a steady trickle that turned into
      # five open PRs in a single day for a solo operator — pure coordination
      # noise. Security advisories are NOT on this schedule; they still fire
      # immediately via Dependabot alerts.
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      # ── The AI SDK moves as ONE unit, majors included. ──
      # `ai`, `@ai-sdk/anthropic` and `@ai-sdk/xai` share a transitive
      # `@ai-sdk/provider-utils`. Bumping any one alone splits that tree
      # (4.0.40 vs 5.0.12) and breaks lib/ai/research.ts with SharedV4-vs-V3
      # type errors. Dependabot's default of one-PR-per-major produced exactly
      # that: three separate, individually-unmergeable PRs (#68/#69/#70).
      # Listed FIRST so these packages land here rather than in the group below.
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
        update-types: ["minor", "patch", "major"]
      # Batch low-risk bumps into one PR to keep review load sane for a solo op.
      minor-and-patch:
        update-types: ["minor", "patch"]
    # Majors on the money path (stripe) get their own PR so they're reviewed
    # deliberately with a checkout smoke test — never auto-batched.
    ignore:
      # Suppress recurring major bumps that break the build and keep getting
      # closed. typescript@7 is the Go-native compiler rewrite (huge breaking
      # change); @types/node@26 jumps ahead of our Node runtime; eslint@10
      # removed the context.getFilename() rule API, which the eslint-plugin-react
      # bundled in the latest eslint-config-next still calls (hard crash — closed
      # #29). Minor/patch updates for all three still flow. Remove an entry to
      # intentionally take the major later.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
